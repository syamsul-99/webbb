<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipPlay - Modern Web</title>
  <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- NAVBAR -->
  <header class="bg-pink-400 text-white px-6 py-4 sticky top-0 shadow-md z-50">
    <nav class="flex justify-between items-center max-w-6xl mx-auto">
      <h1 class="font-bold text-lg">MyWebsite</h1>
      <ul class="flex gap-6 text-sm">
        <li class="cursor-pointer hover:underline">Home</li>
        <li class="cursor-pointer hover:underline">About</li>
        <li class="cursor-pointer hover:underline">Contact</li>
      </ul>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <section class="text-center py-20 px-6 bg-gradient-to-b from-primary-light to-gray-50">
    <h1 class="text-4xl md:text-5xl font-bold mb-4 text-primary-dark">
      Learn Tailwind CSS
    </h1>
    <p class="text-gray-600 mb-6">
      Create a website easily
    </p>
    <button class="bg-primary text-white px-5 py-2 rounded hover:bg-primary-dark transition">
      Start now
    </button>
  </section>

  <!-- ABOUT SECTION -->
  <section class="px-6 py-10 max-w-6xl mx-auto">
    <h2 class="text-2xl font-bold text-center mb-4 text-primary-dark">
      About Us
    </h2>
    <p class="text-gray-600 text-center leading-relaxed max-w-2xl mx-auto">
      We provide modern web learning using Tailwind CSS.
    </p>
  </section>

  <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 px-6 py-10 max-w-6xl mx-auto">

    <!-- Card 1 -->
    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
      <img
        src="https://th.bing.com/th/id/OIP.1N2qZOAsGCEvKXF42q3F5AHaE9?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3"
        alt="HTML"
        class="w-full h-40 object-cover"
      >
      <div class="p-6">
        <h3 class="font-bold text-lg mb-2 text-primary">02</h3>
        <p class="text-gray-600 text-sm leading-relaxed">
          kaesang
        </p>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
      <img 
        src="https://1.bp.blogspot.com/-b6opCz_-GtQ/VHlR_JeT2uI/AAAAAAAABQg/8nQ5F43xA5k/s1600/presiden_jokowi.jpg"
        alt="Tailwind CSS"
        class="w-full h-40 object-cover"
      >
      <div class="p-6">
        <h3 class="font-bold text-lg mb-2 text-primary">01</h3>
        <p class="text-gray-600 text-sm leading-relaxed">
          jokowi
        </p>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
      <img
        src="https://tse1.mm.bing.net/th/id/OIP.ONzP9XSXjUtSEgi3vUpVDwHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
        alt="Responsive"
        class="w-full h-40 object-cover"
      >
      <div class="p-6">
        <h3 class="font-bold text-lg mb-2 text-primary">03</h3>
        <p class="text-gray-600 text-sm leading-relaxed">
           gibran
        </p>
      </div>
    </div>

  </section>

  <!-- FORM SECTION -->
  <section class="px-6 py-10">
    <form class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto">
      <h3 class="font-bold text-lg mb-4 text-center text-primary-dark">Contact Us</h3>
      <input
        type="text"
        placeholder="Nama"
        class="border border-gray-300 p-2 w-full mb-4 rounded focus:outline-none focus:ring-2 focus:ring-primary"
      >
      <input
        type="email"
        placeholder="Email"
        class="border border-gray-300 p-2 w-full mb-4 rounded focus:outline-none focus:ring-2 focus:ring-primary"
      >
      <button class="bg-primary text-white px-4 py-2 rounded w-full hover:bg-primary-dark transition">
        Kirim
      </button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer class="bg-gray-800 text-white text-center py-4 mt-10">
    <p class="text-sm">Copyright 2026</p>
  </footer>

</body>
</html>
